# driftwatch example configuration

# Paths to watch for config drift
watch_paths:
  - /etc/myapp/config.yaml
  - /etc/myapp/secrets.env
  - /etc/nginx/nginx.conf

# Webhook endpoint to POST drift alerts to
webhook_url: "https://hooks.example.com/driftwatch"

# How often to check for changes (Go duration string)
interval: 30s

# Where to persist file hashes between restarts
snapshot_file: /var/lib/driftwatch/snapshot.json
